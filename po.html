<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Purchase order — invoicedey</title>
<style>
  :root { --blue:#2467E3; --text:#0F172A; --muted:#64748B; --line:#E2E8F0; --bg:#F8FAFC; --green:#047857; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif; }
  .wrap { max-width:720px; margin:0 auto; padding:28px 16px 60px; }
  .topbar { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:18px; flex-wrap:wrap; }
  .brand { font-weight:800; font-size:20px; letter-spacing:-.6px; }
  .brand em { color:var(--blue); font-style:normal; }
  .button { display:inline-flex; align-items:center; justify-content:center; padding:10px 14px; border:1px solid var(--line); border-radius:9px; background:#fff; color:var(--text); text-decoration:none; font-weight:700; cursor:pointer; font-size:13px; }
  .button.primary { background:var(--blue); color:#fff; border-color:var(--blue); }
  .button:disabled { opacity:.55; cursor:not-allowed; }
  .card { background:#fff; border:1px solid var(--line); border-radius:16px; padding:28px; box-shadow:0 8px 30px rgba(15,23,42,.06); }
  .head { display:flex; justify-content:space-between; gap:24px; padding-bottom:20px; border-bottom:2px solid var(--blue); flex-wrap:wrap; }
  .issuer { font-size:20px; font-weight:800; }
  .contact { color:var(--muted); font-size:12px; white-space:pre-line; margin-top:5px; }
  .doc { text-align:right; }
  .doc-type { color:var(--blue); font-weight:800; text-transform:uppercase; letter-spacing:1.5px; font-size:11px; }
  .meta { color:var(--muted); font-size:12px; margin-top:5px; line-height:1.6; }
  .parties { display:grid; grid-template-columns:1fr 1fr; gap:24px; padding:22px 0 16px; }
  @media (max-width:560px) { .parties { grid-template-columns:1fr; } .doc { text-align:left; } }
  .label { color:#64748B; text-transform:uppercase; font-size:10px; font-weight:800; letter-spacing:.8px; margin-bottom:6px; }
  .party-name { font-weight:750; font-size:15px; }
  .party-extra { color:var(--muted); font-size:12px; line-height:1.5; margin-top:3px; }
  .status-badge { display:inline-flex; align-items:center; padding:5px 10px; border-radius:999px; background:#EFF6FF; color:#1D4ED8; font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.6px; }
  .table-wrap { overflow-x:auto; margin-top:12px; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th, td { padding:10px 8px; border-bottom:1px solid var(--line); text-align:left; }
  th { font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); }
  .right { text-align:right; }
  .totals { margin-top:16px; text-align:right; font-size:15px; font-weight:800; }
  .note { margin-top:16px; padding:12px; border-radius:10px; background:var(--bg); border:1px solid var(--line); font-size:13px; color:var(--muted); }
  .response { margin-top:20px; padding:18px; border-radius:12px; border:1px solid var(--line); background:#f8fafc; }
  .response h3 { margin:0 0 10px; font-size:15px; }
  .field { margin-bottom:12px; }
  .field label { display:block; font-size:12px; font-weight:600; margin-bottom:4px; color:var(--muted); }
  .field input[type=text], .field textarea { width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:8px; font:inherit; }
  .field textarea { min-height:72px; resize:vertical; }
  .ok { color:var(--green); font-weight:700; margin-top:8px; }
  .err { color:#b91c1c; font-size:13px; margin-top:8px; }
  .footer { margin-top:24px; text-align:center; color:var(--muted); font-size:12px; }
  .empty { text-align:center; padding:48px 20px; color:var(--muted); }
  .empty h2 { color:var(--text); margin:0 0 8px; }
  @media print {
    body { background:#fff; }
    .topbar .button, .footer, .response, #noPrint { display:none !important; }
    .card { box-shadow:none; border:none; padding:0; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="brand">invoice<em>dey</em></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button type="button" class="button" id="publicPrintBtn">Print / PDF</button>
    </div>
  </div>
  <div id="root"><div class="card empty"><p>Loading purchase order…</p></div></div>
  <div class="footer">Shared via Invoicedey · Supplier view</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://spzrnnqeshejdmnocvut.supabase.co';
const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_cI6BHYTzGjADHJIjm8r6ng_2Q8_tlhQ';
const PUBLIC_PO_LS_KEY = 'invoicedey-public-pos';
let currentToken = '';
let currentPayload = null;

function money(n, currency) {
  const cur = currency || 'NGN';
  try {
    return new Intl.NumberFormat(undefined, { style: 'currency', currency: cur, maximumFractionDigits: 2 }).format(Number(n) || 0);
  } catch {
    return (cur + ' ' + (Number(n) || 0).toFixed(2));
  }
}

function escapeHtml(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function renderNotFound(msg) {
  document.getElementById('root').innerHTML =
    '<div class="card empty"><h2>Purchase order unavailable</h2><p>' + escapeHtml(msg || 'This link is invalid or was disabled.') + '</p></div>';
}

function loadLocalSnapshot(token) {
  try {
    const raw = localStorage.getItem(PUBLIC_PO_LS_KEY);
    if (!raw) return null;
    const map = JSON.parse(raw);
    const row = map && map[token];
    if (!row || row.enabled === false) return null;
    return row.payload || row;
  } catch { return null; }
}

function saveLocalFeedback(token, feedback) {
  try {
    let map = {};
    try { map = JSON.parse(localStorage.getItem(PUBLIC_PO_LS_KEY) || '{}') || {}; } catch (_) { map = {}; }
    if (!map[token]) map[token] = { enabled: true, payload: currentPayload || {} };
    if (!map[token].payload) map[token].payload = currentPayload || {};
    map[token].payload.supplier_feedback = feedback;
    map[token].updated_at = new Date().toISOString();
    localStorage.setItem(PUBLIC_PO_LS_KEY, JSON.stringify(map));
  } catch (e) { console.warn(e); }
}

async function loadSupabase() {
  return window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
}

async function loadFromCloud(token) {
  if (!SUPABASE_PUBLISHABLE_KEY || SUPABASE_PUBLISHABLE_KEY.includes('PASTE_YOUR')) return null;
  try {
    const client = await loadSupabase();
    const { data, error } = await client.rpc('get_public_purchase', { p_token: token });
    if (error) throw error;
    if (data) return typeof data === 'string' ? JSON.parse(data) : data;
  } catch (e) {
    console.warn('get_public_purchase', e);
  }
  try {
    const client = await loadSupabase();
    const { data, error } = await client
      .from('public_purchase_links')
      .select('payload, enabled')
      .eq('token', token)
      .maybeSingle();
    if (error) throw error;
    if (data && data.enabled !== false && data.payload) return data.payload;
  } catch (e) {
    console.warn('public_purchase_links', e);
  }
  return null;
}

async function submitFeedback(feedback) {
  saveLocalFeedback(currentToken, feedback);
  if (currentPayload) currentPayload.supplier_feedback = feedback;
  try {
    const client = await loadSupabase();
    // Prefer RPC if available
    try {
      const { error } = await client.rpc('submit_public_purchase_feedback', {
        p_token: currentToken,
        p_confirmed: !!feedback.confirmed,
        p_note: feedback.note || '',
        p_invoice_name: feedback.invoice_name || '',
        p_invoice_mime: feedback.invoice_mime || '',
        p_invoice_data_url: feedback.invoice_data_url || null
      });
      if (!error) return true;
    } catch (_) {}
    // Fallback: read-modify-write payload (needs update policy for anon — may fail)
    const { data } = await client.from('public_purchase_links').select('payload').eq('token', currentToken).maybeSingle();
    if (data && data.payload) {
      const next = Object.assign({}, data.payload, { supplier_feedback: feedback });
      const { error } = await client.from('public_purchase_links')
        .update({ payload: next, updated_at: new Date().toISOString() })
        .eq('token', currentToken)
        .eq('enabled', true);
      if (!error) return true;
    }
  } catch (e) {
    console.warn('submit feedback cloud', e);
  }
  return true; // local always saved
}

function renderResponseForm(payload) {
  const fb = (payload && payload.supplier_feedback) || {};
  const already = !!(fb.confirmed || fb.note || fb.invoice_name);
  let body = '<div class="response" id="noPrint"><h3>Supplier response</h3>';
  if (already) {
    body += '<p class="ok">✓ Response recorded' + (fb.confirmed_at ? ' · ' + escapeHtml(String(fb.confirmed_at).replace('T', ' ').slice(0, 16)) : '') + '</p>';
    if (fb.note) body += '<p class="meta">' + escapeHtml(fb.note) + '</p>';
    if (fb.invoice_name) body += '<p class="meta">📎 ' + escapeHtml(fb.invoice_name) + '</p>';
    body += '<p class="meta" style="margin-top:10px">You can update your note or replace the invoice below.</p>';
  } else {
    body += '<p class="meta" style="margin:0 0 12px">Confirm you can fulfil this order and optionally attach your invoice.</p>';
  }
  body +=
    '<div class="field"><label><input type="checkbox" id="supConfirm"' + (fb.confirmed ? ' checked' : '') + '> I confirm this purchase order</label></div>' +
    '<div class="field"><label>Note to buyer (optional)</label><textarea id="supNote" placeholder="Lead time, substitutions, bank details…">' + escapeHtml(fb.note || '') + '</textarea></div>' +
    '<div class="field"><label>Upload invoice (PDF or image, max ~1.5 MB)</label><input type="file" id="supInvoice" accept="image/*,.pdf,application/pdf"></div>' +
    '<button type="button" class="button primary" id="supSubmit">Send to buyer</button>' +
    '<div id="supMsg"></div></div>';
  return body;
}

function render(payload) {
  if (!payload || !payload.purchase_number) {
    renderNotFound('This purchase order could not be displayed.');
    return;
  }
  currentPayload = payload;
  const biz = payload.buyer || {};
  const sup = payload.supplier || {};
  const lines = payload.lines || [];
  const currency = payload.currency || 'NGN';
  const status = payload.status_label || payload.status || 'Ordered';
  const rows = lines.map(l => {
    const qty = Number(l.qty) || 0;
    const cost = Number(l.unit_cost) || 0;
    return '<tr><td>' + escapeHtml(l.name || 'Item') + '</td>' +
      '<td class="right">' + qty + '</td>' +
      '<td class="right">' + escapeHtml(money(cost, currency)) + '</td>' +
      '<td class="right">' + escapeHtml(money(qty * cost, currency)) + '</td></tr>';
  }).join('');

  document.getElementById('root').innerHTML =
    '<div class="card">' +
      '<div class="head">' +
        '<div>' +
          '<div class="issuer">' + escapeHtml(biz.name || 'Buyer') + '</div>' +
          (biz.contact ? '<div class="contact">' + escapeHtml(biz.contact) + '</div>' : '') +
        '</div>' +
        '<div class="doc">' +
          '<div class="doc-type">Purchase order</div>' +
          '<div style="font-size:18px;font-weight:800;margin-top:4px">' + escapeHtml(payload.purchase_number) + '</div>' +
          '<div class="meta">Date: ' + escapeHtml(payload.order_date || '—') + '</div>' +
          '<div style="margin-top:8px"><span class="status-badge">' + escapeHtml(status) + '</span></div>' +
        '</div>' +
      '</div>' +
      '<div class="parties">' +
        '<div><div class="label">From (buyer)</div><div class="party-name">' + escapeHtml(biz.name || '—') + '</div>' +
          (biz.email || biz.phone ? '<div class="party-extra">' + escapeHtml([biz.email, biz.phone].filter(Boolean).join(' · ')) + '</div>' : '') +
        '</div>' +
        '<div><div class="label">To (supplier)</div><div class="party-name">' + escapeHtml(sup.name || 'Supplier') + '</div>' +
          (sup.email || sup.phone ? '<div class="party-extra">' + escapeHtml([sup.email, sup.phone].filter(Boolean).join(' · ')) + '</div>' : '') +
        '</div>' +
      '</div>' +
      '<div class="table-wrap"><table><thead><tr><th>Item</th><th class="right">Qty</th><th class="right">Unit cost</th><th class="right">Amount</th></tr></thead><tbody>' +
        (rows || '<tr><td colspan="4">No lines</td></tr>') +
      '</tbody></table></div>' +
      '<div class="totals">Total ' + escapeHtml(money(payload.total, currency)) + '</div>' +
      (payload.note ? '<div class="note"><strong>Note</strong><br>' + escapeHtml(payload.note) + '</div>' : '') +
      renderResponseForm(payload) +
    '</div>';

  document.getElementById('supSubmit')?.addEventListener('click', onSubmitFeedback);
}

function readFileAsDataUrl(file) {
  return new Promise((resolve, reject) => {
    if (!file) return resolve(null);
    if (file.size > 1.6 * 1024 * 1024) {
      reject(new Error('File too large (max about 1.5 MB). Compress or send a smaller PDF.'));
      return;
    }
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = () => reject(new Error('Could not read file'));
    reader.readAsDataURL(file);
  });
}

async function onSubmitFeedback() {
  const msg = document.getElementById('supMsg');
  const btn = document.getElementById('supSubmit');
  if (btn) btn.disabled = true;
  try {
    const confirmed = !!(document.getElementById('supConfirm') && document.getElementById('supConfirm').checked);
    const note = (document.getElementById('supNote') && document.getElementById('supNote').value || '').trim();
    const fileInput = document.getElementById('supInvoice');
    const file = fileInput && fileInput.files && fileInput.files[0];
    let invoice_data_url = null;
    let invoice_name = '';
    let invoice_mime = '';
    if (file) {
      invoice_data_url = await readFileAsDataUrl(file);
      invoice_name = file.name || 'invoice';
      invoice_mime = file.type || '';
    } else if (currentPayload && currentPayload.supplier_feedback) {
      invoice_data_url = currentPayload.supplier_feedback.invoice_data_url || null;
      invoice_name = currentPayload.supplier_feedback.invoice_name || '';
      invoice_mime = currentPayload.supplier_feedback.invoice_mime || '';
    }
    if (!confirmed && !note && !invoice_name) {
      if (msg) { msg.className = 'err'; msg.textContent = 'Confirm the order, add a note, or attach an invoice.'; }
      return;
    }
    const feedback = {
      confirmed,
      confirmed_at: confirmed ? new Date().toISOString() : (currentPayload?.supplier_feedback?.confirmed_at || null),
      note,
      invoice_name,
      invoice_mime,
      invoice_data_url,
      submitted_at: new Date().toISOString()
    };
    await submitFeedback(feedback);
    if (msg) { msg.className = 'ok'; msg.textContent = 'Sent — the buyer will see this on the purchase order.'; }
    render(Object.assign({}, currentPayload, { supplier_feedback: feedback }));
  } catch (e) {
    if (msg) { msg.className = 'err'; msg.textContent = e.message || 'Could not send response'; }
  } finally {
    if (btn) btn.disabled = false;
  }
}

(async function () {
  const token = new URLSearchParams(location.search).get('token');
  currentToken = token || '';
  if (!token) { renderNotFound('No purchase order token was provided.'); return; }

  let payload = loadLocalSnapshot(token);
  if (!payload) payload = await loadFromCloud(token);
  if (!payload) {
    renderNotFound('We could not load this purchase order. The link may be disabled, or cloud sharing is not set up yet.');
    return;
  }
  render(payload);
  document.getElementById('publicPrintBtn')?.addEventListener('click', () => window.print());
})();
</script>
</body>
</html>
